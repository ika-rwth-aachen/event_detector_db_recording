name: consistency

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  consistency:
    uses: openads-project/openads-dev-environment/.github/workflows/consistency.yml@main
    with:
      skip-checks: compose_generator_is_idempotent,helm_generator_is_idempotent,readme_generator_is_idempotent
    secrets: inherit
